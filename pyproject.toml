[project]
name = "document-intelligence-workbench"
version = "0.1.0"
description = "Evidence-linked extraction and review for bank statements"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<6",
  "pillow>=13.0,<14",
  "prometheus-client>=0.22,<1",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
