name: document-workbench

x-app: &app
  image: document-workbench/app:local
  build:
    context: .
    target: application
  environment:
    DATABASE_URL: postgresql://workbench:${WORKBENCH_DB_PASSWORD:?Set WORKBENCH_DB_PASSWORD in .env}@db:5432/workbench
  networks: [database]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: workbench
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: ${WORKBENCH_DB_PASSWORD:?Set WORKBENCH_DB_PASSWORD in .env}
    networks: [database]
    volumes: [data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "workbench.db", "migrate"]
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    networks: [database, gateway]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    <<: *app
    command: ["python", "-m", "workbench.worker"]
    environment:
      DATABASE_URL: postgresql://workbench:${WORKBENCH_DB_PASSWORD:?Set WORKBENCH_DB_PASSWORD in .env}@db:5432/workbench
      PARSER_URL: http://parser:8011
      WORKER_METRICS_PORT: "9200"
    networks: [database, extraction]
    depends_on:
      migrate: {condition: service_completed_successfully}
      parser: {condition: service_healthy}
    stop_grace_period: 120s
    restart: unless-stopped

  parser:
    build:
      context: .
      target: parser
    networks: [extraction]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    networks: [gateway]
    ports: ["127.0.0.1:${WORKBENCH_PORT:-8080}:8080"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - "/config:uid=10001,gid=10001,mode=0700,size=16m"
      - "/data:uid=10001,gid=10001,mode=0700,size=16m"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on: [api]
    restart: unless-stopped

networks:
  database: {internal: true}
  extraction: {internal: true}
  gateway: {}

volumes:
  data:
