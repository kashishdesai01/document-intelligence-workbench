name: Workbench CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://workbench:ci_only_password@127.0.0.1:5432/workbench
      WORKBENCH_TEST_DATABASE_URL: postgresql://workbench:ci_only_password@127.0.0.1:5432/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install uv==0.10.8
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
          npm ci --prefix frontend
      - name: Lint and test
        run: |
          uv run --frozen ruff check workbench tests eval
          uv run --frozen ruff format --check workbench tests eval
          uv run --frozen pytest -q
          npm run build --prefix frontend
      - name: Audit dependencies
        run: |
          uv run --frozen pip-audit --local
          npm audit --prefix frontend --audit-level=high
      - name: Frozen synthetic quality gates
        run: uv run --frozen python -m eval.runner --check
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run upload, review, and export in Chromium
        run: |
          uv run --frozen python -m workbench.db migrate
          credentials="$(uv run --frozen python -m workbench.db create-key --name CI)"
          export WORKBENCH_E2E_KEY="$(printf '%s\n' "$credentials" | awk '/^Bearer key /{print $3}')"
          echo "::add-mask::$WORKBENCH_E2E_KEY"
          uv run --frozen uvicorn workbench.api:app --host 127.0.0.1 --port 8010 --no-access-log &
          uv run --frozen uvicorn workbench.parser_api:app --host 127.0.0.1 --port 8011 --no-access-log &
          PARSER_URL=http://127.0.0.1:8011 uv run --frozen python -m workbench.worker &
          npm run dev --prefix frontend -- --strictPort &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          curl --fail --silent --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8010/readyz
          curl --fail --silent --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:5173/ > /dev/null
          npm run test:e2e --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evaluation
          path: eval/output/
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WORKBENCH_DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --detach
      - name: Wait for gateway, migrations, and worker
        run: curl --fail --silent --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/readyz
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
